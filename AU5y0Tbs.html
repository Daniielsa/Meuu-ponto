<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Ponto Mobile</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f1f5f9;
            --surface: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 12px;
            font-size: 16px;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: var(--surface);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin: 0 0 4px 0;
        }
        .clock {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            letter-spacing: -1px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .full-row {
            grid-column: span 2;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            height: 48px; /* Altura ideal para toque no celular */
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            background-color: #f8fafc;
            color: var(--text);
            outline: none;
            -webkit-appearance: none; /* Remove estilos padrão do iOS */
        }
        input:focus, select:focus {
            border-color: var(--primary);
            background-color: #fff;
        }
        .btn-submit {
            width: 100%;
            height: 52px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }
        .btn-submit:active {
            background-color: #1d4ed8;
            transform: scale(0.98);
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
        }
        .history-header h2 {
            font-size: 1.1rem;
            margin: 0;
        }
        .btn-clear {
            background: none;
            border: none;
            color: var(--danger);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 6px;
        }
        /* Lista estilo Cards para celular (Melhor que tabela comprimida) */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
        }
        .ponto-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        .card-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            font-size: 0.8rem;
            color: #475569;
        }
        .card-details span b {
            color: var(--text);
            display: block;
            font-size: 0.9rem;
        }
        .badge-extra {
            color: var(--success);
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>⏱️ Meu Ponto</h1>
    <div class="clock" id="liveClock">00:00:00</div>

    <!-- Formulário Mobile -->
    <div class="form-row">
        <div class="input-group">
            <label>Data</label>
            <input type="date" id="dataPonto">
        </div>
        <div class="input-group">
            <label>Tipo de Dia</label>
            <select id="tipoDia">
                <option value="50">Extra 50%</option>
                <option value="100">Extra 100%</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="input-group">
            <label>Entrada</label>
            <input type="time" id="entrada">
        </div>
        <div class="input-group">
            <label>Saída Almoço</label>
            <input type="time" id="almocoSaida">
        </div>
    </div>

    <div class="form-row">
        <div class="input-group">
            <label>Volta Almoço</label>
            <input type="time" id="almocoRetorno">
        </div>
        <div class="input-group">
            <label>Saída Trabalho</label>
            <input type="time" id="saida">
        </div>
    </div>

    <button class="btn-submit" onclick="salvarPonto()">Registrar Dia</button>

    <!-- Histórico Otimizado -->
    <div class="history-header">
        <h2>📋 Histórico Registrado</h2>
        <button class="btn-clear" onclick="limparHistorico()">Limpar tudo</button>
    </div>
    
    <div class="card-list" id="listaPontos">
        <!-- Os cards de ponto entram aqui via JavaScript -->
    </div>
</div>

<script>
    // Relógio digital em tempo real
    setInterval(() => {
        const agora = new Date();
        document.getElementById('liveClock').textContent = agora.toLocaleTimeString('pt-BR');
    }, 1000);

    // Ajusta a data inicial para o dia de hoje automaticamente
    document.getElementById('dataPonto').value = new Date().toISOString().split('T')[0];

    // Carrega dados locais ao iniciar
    window.onload = carregarHistorico;

    function converterParaMinutos(timeStr) {
        if (!timeStr) return 0;
        const [horas, minutos] = timeStr.split(':').map(Number);
        return (horas * 60) + minutos;
    }

    function formatarHoras(minutosTotais) {
        if (minutosTotais <= 0) return "00:00";
        const horas = Math.floor(minutosTotais / 60);
        const minutos = minutosTotais % 60;
        return `${String(horas).padStart(2, '0')}:${String(minutos).padStart(2, '0')}`;
    }

    function salvarPonto() {
        const data = document.getElementById('dataPonto').value;
        const tipo = document.getElementById('tipoDia').value;
        const e = converterParaMinutos(document.getElementById('entrada').value);
        const as = converterParaMinutos(document.getElementById('almocoSaida').value);
        const ar = converterParaMinutos(document.getElementById('almocoRetorno').value);
        const s = converterParaMinutos(document.getElementById('saida').value);

        if (!e || !s) {
            alert('🚨 Preencha pelo menos a Entrada e a Saída final.');
            return;
        }

        const tempoTotal = (as - e) + (s - ar);
        const intervalo = ar - as;
        
        let jornadaPadrao = 480; // 8 horas diárias padrão
        let extra = 0;

        if (tempoTotal > jornadaPadrao) {
            extra += (tempoTotal - jornadaPadrao);
        }

        // Regra do intervalo menor que 1 hora para jornadas de 8h
        if (intervalo > 0 && intervalo < 60) {
            extra += (60 - intervalo); 
        }

        const registro = {
            data: data.split('-').reverse().join('/'),
            trabalhado: formatarHoras(tempoTotal),
            intervalo: formatarHoras(intervalo),
            extra: formatarHoras(extra),
            tipo: tipo
        };

        let historico = JSON.parse(localStorage.getItem('meusPontosMobile')) || [];
        historico.unshift(registro); // Insere o mais recente no topo
        localStorage.setItem('meusPontosMobile', JSON.stringify(historico));

        carregarHistorico();
        limparCamposHoras();
    }

    function carregarHistorico() {
        const lista = document.getElementById('listaPontos');
        lista.innerHTML = '';
        const historico = JSON.parse(localStorage.getItem('meusPontosMobile')) || [];

        if (historico.length === 0) {
            lista.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px;">Nenhum ponto registrado ainda.</div>';
            return;
        }

        historico.forEach(p => {
            const card = `
                <div class="ponto-card">
                    <div class="card-top">
                        <span>📅 ${p.data}</span>
                        <span class="badge-extra">+${p.extra} (${p.tipo}%)</span>
                    </div>
                    <div class="card-details">
                        <span>Trabalhado:<b>${p.trabalhado}h</b></span>
                        <span>Almoço:<b>${p.intervalo}h</b></span>
                    </div>
                </div>
            `;
            lista.innerHTML += card;
        });
    }

    function limparCamposHoras() {
        document.getElementById('entrada').value = '';
        document.getElementById('almocoSaida').value = '';
